# Sample Prometheus configuration for scraping the JKP API.
#
# Not run automatically by `docker compose up` — no Prometheus/Grafana
# container is wired into docker-compose.yml (Milestone 6 kept this
# infra-light: the app exposes /metrics, standing up the scrape/dashboard
# side is a deliberately separate concern). To try it locally:
#
#   docker run -p 9090:9090 -v $(pwd)/infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml \
#     --network joe-knowledge-platform_default prom/prometheus
#
# then open http://localhost:9090 and query e.g.
# `rate(http_requests_total[5m])` or
# `histogram_quantile(0.95, http_request_duration_seconds_bucket)`.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: jkp-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
