## Temple TV — Render Blueprint
## 5 services: api (web) · broadcast-daemon (pserv) · admin (static) · web (static) · tv (static)
##
## Shared env-var groups — define secrets ONCE in the Render dashboard:
##   temple-tv-shared-secrets → DATABASE_URL, JWT_* , REDIS_URL, SENTRY_DSN
##   temple-tv-domains        → CORS_ORIGINS, APP_BASE_URL
##
## After applying this Blueprint, set every `sync: false` key in
## the Render dashboard Environment Groups / Service Environment tabs.

envVarGroups:
  - name: temple-tv-shared-secrets
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SENTRY_DSN
        sync: false

  - name: temple-tv-domains
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false

services:

  # ── API (Fastify + SSE + notification dispatcher) ───────────────────────────
  - type: web
    name: temple-tv-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    rootDir: .
    autoDeploy: true
    pullRequestPreviewsEnabled: false

    buildFilter:
      paths:
        - artifacts/api-server/**
        - lib/db/**
        - lib/api-spec/**
        - lib/broadcast-types/**
        - lib/broadcast-sync/**
        - pnpm-lock.yaml
        - package.json
        - pnpm-workspace.yaml
        - scripts/**
        - render.yaml

    # DB migration runs in preDeployCommand (after build, before traffic swap)
    # so DATABASE_URL is available as a live env var — not at build time.
    buildCommand: |
      bash ./scripts/render-install.sh && \
      pnpm run verify:render && \
      pnpm --filter @workspace/api-server run build

    preDeployCommand: pnpm --filter @workspace/db run push-force

    startCommand: pnpm --filter @workspace/api-server run start:render-free

    healthCheckPath: /api/healthz

    envVars:
      - fromGroup: temple-tv-shared-secrets
      - fromGroup: temple-tv-domains

      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: RUN_MODE
        value: all
      - key: TRANSCODER_DISABLE
        value: "true"
      - key: TRANSCODING_AUTO_RETRY_DISABLE
        value: "true"
      - key: HLS_MAX_CONCURRENT
        value: "3"
      - key: DB_POOL_MAX
        value: "5"
      - key: HLS_SEGMENT_CACHE_MB
        value: "8"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=256 --max-http-header-size=16384"
      - key: MEMORY_WARN_RSS_MB
        value: "380"
      - key: MEMORY_RESTART_RSS_MB
        value: "430"
      - key: MEMORY_ABSOLUTE_MAX_RSS_MB
        value: "460"
      - key: SHUTDOWN_DRAIN_MS
        value: "10000"
      - key: SHUTDOWN_PRECLOSE_DELAY_MS
        value: "10000"
      - key: SHUTDOWN_FORCE_EXIT_BUDGET_MS
        value: "28000"
      - key: HTTP_KEEPALIVE_MS
        value: "75000"
      - key: HTTP_HEADERS_TIMEOUT_MS
        value: "80000"
      - key: SCHEDULED_NOTIF_POLL_MS
        value: "30000"
      - key: SCHEDULED_NOTIF_MAX_ATTEMPTS
        value: "5"
      - key: STORAGE_HEALTH_INTERVAL_MS
        value: "120000"
      - key: QUEUE_MIN_ITEMS
        value: "5"
      - key: YOUTUBE_SYNC_INTERVAL_MINS
        value: "30"
      - key: CORS_ORIGINS_EXTRA
        value: ""
      - key: API_ORIGIN
        value: https://api.templetv.org.ng
      - key: ADMIN_API_TOKEN
        generateValue: true

      # Broadcast daemon injected by Render's fromService wiring
      - key: BROADCAST_DAEMON_HOST
        fromService:
          name: temple-tv-broadcast-daemon
          type: pserv
          property: host
      - key: BROADCAST_DAEMON_PORT
        fromService:
          name: temple-tv-broadcast-daemon
          type: pserv
          property: port

      # Operator-managed secrets — set in Render dashboard
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        value: "Temple TV | JCTM"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: HLS_TOKEN_SECRET
        sync: false
      - key: REQUIRE_HLS_TOKEN
        sync: false
      - key: CDN_BASE_URL
        sync: false
      - key: BROADCAST_DEADAIR_FALLBACK_URL
        sync: false
      - key: BROADCAST_DEADAIR_FALLBACK_AFTER_MS
        sync: false
      - key: CLIENT_ERROR_SINK_URL
        sync: false
      - key: CLIENT_ERROR_SINK_TOKEN
        sync: false

  # ── Broadcast daemon (pserv — internal only) ────────────────────────────────
  # pserv: no healthCheckPath, no region — Render monitors via process health.
  - type: pserv
    name: temple-tv-broadcast-daemon
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    rootDir: .
    autoDeploy: true
    pullRequestPreviewsEnabled: false

    # Deliberately no buildFilter. The daemon is the playback authority and must
    # never remain on an older commit while the API/admin deploy ahead of it.
    # Render therefore redeploys this service for every main-branch commit.
    buildCommand: |
      bash ./scripts/render-install.sh && \
      pnpm --filter @workspace/api-server run build

    startCommand: pnpm --filter @workspace/api-server run start:render-daemon

    envVars:
      - fromGroup: temple-tv-shared-secrets

      - key: NODE_ENV
        value: production
      - key: PORT
        value: "9000"
      - key: RUN_MODE
        value: broadcast
      - key: TRANSCODER_DISABLE
        value: "true"
      - key: TRANSCODING_AUTO_RETRY_DISABLE
        value: "true"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=300 --max-http-header-size=16384"
      - key: MEMORY_WARN_RSS_MB
        value: "380"
      - key: MEMORY_RESTART_RSS_MB
        value: "430"
      - key: MEMORY_ABSOLUTE_MAX_RSS_MB
        value: "450"
      - key: SHUTDOWN_DRAIN_MS
        value: "5000"
      - key: SHUTDOWN_PRECLOSE_DELAY_MS
        value: "5000"
      - key: SHUTDOWN_FORCE_EXIT_BUDGET_MS
        value: "25000"
      - key: HTTP_KEEPALIVE_MS
        value: "75000"
      - key: HTTP_HEADERS_TIMEOUT_MS
        value: "80000"
      - key: DB_POOL_MAX
        value: "8"
      - key: QUEUE_MIN_ITEMS
        value: "5"
      - key: YOUTUBE_SYNC_INTERVAL_MINS
        value: "30"
      - key: API_ORIGIN
        value: https://api.templetv.org.ng
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_WEBHOOK_SECRET
        sync: false
      - key: HLS_TOKEN_SECRET
        sync: false
      - key: REQUIRE_HLS_TOKEN
        sync: false
      - key: INTERNAL_HLS_BYPASS_SECRET
        sync: false
      - key: BROADCAST_DEADAIR_FALLBACK_URL
        sync: false
      - key: BROADCAST_DEADAIR_FALLBACK_AFTER_MS
        sync: false
      - key: CLIENT_ERROR_SINK_URL
        sync: false
      - key: CLIENT_ERROR_SINK_TOKEN
        sync: false

  # ── Admin SPA ────────────────────────────────────────────────────────────────
  # env: static — Render CDN; no region, no PORT envVar allowed.
  - type: web
    name: temple-tv-admin
    env: static
    branch: main
    rootDir: .
    autoDeploy: true
    pullRequestPreviewsEnabled: false

    buildFilter:
      paths:
        - artifacts/admin/**
        - lib/api-spec/**
        - lib/api-client-react/**
        - lib/api-zod/**
        - lib/broadcast-types/**
        - lib/broadcast-sync/**
        - pnpm-lock.yaml
        - package.json
        - pnpm-workspace.yaml

    buildCommand: |
      bash ./scripts/render-install.sh && \
      pnpm run verify:render && \
      pnpm --filter @workspace/admin run build

    staticPublishPath: ./artifacts/admin/dist/public

    headers:
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains; preload"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), interest-cohort=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /index.html
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        value: https://api.templetv.org.ng
      - key: VITE_SENTRY_DSN
        sync: false

  # ── Mobile PWA (Expo Web) ────────────────────────────────────────────────────
  - type: web
    name: temple-tv-web
    env: static
    branch: main
    rootDir: .
    autoDeploy: true
    pullRequestPreviewsEnabled: false

    buildFilter:
      paths:
        - artifacts/mobile/**
        - lib/api-spec/**
        - lib/api-client-react/**
        - lib/api-zod/**
        - lib/broadcast-types/**
        - lib/broadcast-sync/**
        - lib/player-core/**
        - pnpm-lock.yaml
        - package.json
        - pnpm-workspace.yaml

    buildCommand: |
      bash ./scripts/render-install.sh && \
      pnpm run verify:render && \
      pnpm --filter @workspace/mobile run build:web

    staticPublishPath: ./artifacts/mobile/web-dist

    headers:
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains; preload"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), interest-cohort=()"
      - path: /index.html
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /_expo/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://api.templetv.org.ng
      - key: EXPO_PUBLIC_DOMAIN
        value: api.templetv.org.ng
      - key: EXPO_PUBLIC_SENTRY_DSN
        sync: false

  # ── Smart TV SPA ─────────────────────────────────────────────────────────────
  - type: web
    name: temple-tv-tv
    env: static
    branch: main
    rootDir: .
    autoDeploy: true
    pullRequestPreviewsEnabled: false

    buildFilter:
      paths:
        - artifacts/tv/**
        - lib/api-spec/**
        - lib/api-client-react/**
        - lib/api-zod/**
        - lib/broadcast-types/**
        - lib/broadcast-sync/**
        - lib/player-core/**
        - pnpm-lock.yaml
        - package.json
        - pnpm-workspace.yaml

    buildCommand: |
      bash ./scripts/render-install.sh && \
      pnpm run verify:render && \
      pnpm --filter @workspace/tv run build

    staticPublishPath: ./artifacts/tv/dist/public

    headers:
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains; preload"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), interest-cohort=()"
      - path: /index.html
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        value: https://api.templetv.org.ng
      - key: VITE_IMA_AD_TAG_URL
        sync: false
