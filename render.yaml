# ════════════════════════════════════════════════════════════════════════════
# Temple TV — Render deployment manifest (free-tier edition, 2026-05-06)
# ════════════════════════════════════════════════════════════════════════════
#
# Five Render services, all in Frankfurt:
#
#   temple-tv-broadcast-daemon  pserv    starter   Broadcast engine
#   temple-tv-api               web      free      Fastify API + SSE + jobs
#   temple-tv-admin             static   free      Admin dashboard
#   temple-tv-web               static   free      Expo Web / PWA
#   temple-tv-tv                static   free      TV / Tizen SPA
#
# Architecture:
#
#   Browser / Mobile / TV
#             │
#             ▼
#      temple-tv-api
#             │
#             │ private network
#             ▼
#   temple-tv-broadcast-daemon
#
# The broadcast daemon owns the long-lived BroadcastOrchestrator and queue
# workers. API deployments therefore do not restart the broadcast engine.
#
# Render free-tier limitations:
#
#   • Web service:       512 MiB RAM / 0.1 vCPU / 1 instance
#   • Static sites:      Free global CDN
#   • Private services:  No free tier
#   • Broadcast daemon:  Starter ($7/month)
#
# No persistent Render disks are used.
# No Render-managed PostgreSQL or Redis is required.
#
# DATABASE_URL and REDIS_URL are externally supplied credentials.
#
# Storage is PostgreSQL BYTEA / storage_blobs.
#
# ════════════════════════════════════════════════════════════════════════════


# ─── Shared environment-variable groups ─────────────────────────────────────

envVarGroups:

  # Cross-service credentials.
  #
  # DATABASE_URL:
  #   PostgreSQL connection string.
  #
  # JWT_ACCESS_SECRET:
  #   At least 32 random characters.
  #
  # JWT_REFRESH_SECRET:
  #   At least 32 random characters.
  #
  # REDIS_URL:
  #   Optional. When absent, the application falls back to an in-process
  #   LRU cache suitable for the single-instance free-tier deployment.
  #
  # SENTRY_DSN:
  #   Optional Sentry project DSN.
  #
  # SENTRY_RELEASE:
  #   Optional release identifier.

  - name: temple-tv-shared-secrets
    envVars:
      - key: DATABASE_URL
        sync: false

      - key: JWT_ACCESS_SECRET
        sync: false

      - key: JWT_REFRESH_SECRET
        sync: false

      - key: REDIS_URL
        sync: false

      - key: SENTRY_DSN
        sync: false

      - key: SENTRY_RELEASE
        sync: false


  # Public routing configuration.
  #
  # CORS_ORIGINS is intentionally managed in the Render dashboard rather
  # than committed into render.yaml so new custom domains do not require
  # a repository change.
  #
  # Recommended production value:
  #
  #   https://templetv.org.ng,
  #   https://www.templetv.org.ng,
  #   https://*.templetv.org.ng
  #
  # Additional domains can be appended without changing this file.
  #
  # APP_BASE_URL is the canonical public-facing URL used when generating
  # links in outbound email.

  - name: temple-tv-domains
    envVars:
      - key: CORS_ORIGINS
        sync: false

      - key: APP_BASE_URL
        sync: false


# ════════════════════════════════════════════════════════════════════════════
# Services
# ════════════════════════════════════════════════════════════════════════════

services:


  # ══════════════════════════════════════════════════════════════════════════
  # temple-tv-api
  #
  # Fastify API + SSE proxy + notification dispatcher
  # Port: 8080
  # Plan: free
  # ══════════════════════════════════════════════════════════════════════════

  - type: web
    name: temple-tv-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    rootDir: .
    autoDeploy: true
    pullRequestPreviewsEnabled: false

    # ── Build filter ────────────────────────────────────────────────────────
    #
    # Only rebuild the API when API code, database/broadcast shared libraries,
    # root build manifests, scripts, or the Render manifest changes.

    buildFilter:
      paths:
        - artifacts/api-server/**
        - lib/db/**
        - lib/api-spec/**
        - lib/broadcast-types/**
        - lib/broadcast-sync/**
        - pnpm-lock.yaml
        - package.json
        - scripts/**
        - render.yaml

    # ── Build ────────────────────────────────────────────────────────────────
    #
    # render-install.sh:
    #   • installs pnpm dependencies
    #   • uses the Render pnpm cache
    #   • uses --frozen-lockfile
    #   • ensures devDependencies are available during the build
    #
    # verify:render:
    #   • validates workspace/catalog configuration
    #   • validates TypeScript configuration
    #   • validates environment-secret guardrails
    #   • validates database schema guardrails
    #
    # tsc --build is intentionally not part of verify:render because the
    # Render free-tier 512 MiB container can OOM during a full project build.

    buildCommand: |
      bash ./scripts/render-install.sh && \
      pnpm run verify:render && \
      pnpm --filter @workspace/db run push-force && \
      pnpm --filter @workspace/api-server run build

    # Free-tier startup.
    #
    # start:render-free must enforce:
    #
    #   --max-old-space-size=256
    #
    # rather than the larger paid-plan heap.

    startCommand: pnpm --filter @workspace/api-server run start:render-free

    # API health endpoint:
    #
    #   200 = healthy
    #   503 = starting
    #   503 = draining
    #   503 = database unavailable

    healthCheckPath: /api/healthz


    # ── Environment ─────────────────────────────────────────────────────────

    envVars:

      # Shared secrets.
      - fromGroup: temple-tv-shared-secrets

      # Public domain configuration.
      - fromGroup: temple-tv-domains


      # ── Runtime ───────────────────────────────────────────────────────────

      - key: NODE_ENV
        value: production

      - key: PORT
        value: "8080"

      # Runs:
      #
      #   • Fastify API
      #   • scheduled notification dispatcher
      #
      # BroadcastOrchestrator is NOT started here when the daemon URL exists.

      - key: RUN_MODE
        value: all


      # ── Free-tier transcoder protection ────────────────────────────────────
      #
      # FFmpeg is disabled because:
      #
      #   • 0.1 vCPU cannot safely sustain encoding workloads
      #   • encoding can consume significant RSS
      #   • an encode job could OOM the API process
      #
      # Use a separate paid worker for transcoding.

      - key: TRANSCODER_DISABLE
        value: "true"


      # ── HLS concurrency ───────────────────────────────────────────────────

      # Free-tier maximum concurrent HLS sessions.
      #
      # Approximate memory model:
      #
      #   baseline          ≈ 280 MiB
      #   each HLS stream   ≈ 24 MiB
      #
      # Three concurrent streams therefore leave reasonable headroom.

      - key: HLS_MAX_CONCURRENT
        value: "3"


      # ── Database pool ─────────────────────────────────────────────────────

      # Small pool appropriate for the single 512 MiB instance.

      - key: DB_POOL_MAX
        value: "5"


      # ── HLS segment cache ─────────────────────────────────────────────────

      - key: HLS_SEGMENT_CACHE_MB
        value: "8"


      # ── Memory containment ─────────────────────────────────────────────────

      # Limit glibc malloc arenas to reduce fragmentation.

      - key: MALLOC_ARENA_MAX
        value: "2"


      # V8 heap cap.
      #
      # Keep this aligned with start:render-free.

      - key: NODE_OPTIONS
        value: "--max-old-space-size=256 --max-http-header-size=16384"


      # Memory warning threshold.

      - key: MEMORY_WARN_RSS_MB
        value: "380"


      # Graceful self-restart threshold.

      - key: MEMORY_RESTART_RSS_MB
        value: "430"


      # Absolute RSS ceiling.
      #
      # At this level the process should immediately begin graceful shutdown
      # rather than allowing the Render OOM killer to terminate it.

      - key: MEMORY_ABSOLUTE_MAX_RSS_MB
        value: "460"


      # ── Graceful shutdown ──────────────────────────────────────────────────

      # Health becomes 503/draining before sockets are closed.

      - key: SHUTDOWN_DRAIN_MS
        value: "10000"

      - key: SHUTDOWN_PRECLOSE_DELAY_MS
        value: "10000"

      # Render's hard termination window is approximately 30 seconds.
      # Leave approximately two seconds of safety margin.

      - key: SHUTDOWN_FORCE_EXIT_BUDGET_MS
        value: "28000"


      # ── Queue monitoring ──────────────────────────────────────────────────

      - key: QUEUE_MIN_ITEMS
        value: "5"


      # ── Dead-air protection ───────────────────────────────────────────────

      # Optional looping HLS fallback.
      #
      # Example:
      #
      #   https://your-cdn.example/fallback/be-right-back.m3u8

      - key: BROADCAST_DEADAIR_FALLBACK_URL
        sync: false

      - key: BROADCAST_DEADAIR_FALLBACK_AFTER_MS
        sync: false


      # ── Storage monitoring ─────────────────────────────────────────────────

      - key: STORAGE_HEALTH_INTERVAL_MS
        value: "120000"


      # ── HTTP server tuning ────────────────────────────────────────────────

      # Suitable for long-lived SSE connections.

      - key: HTTP_KEEPALIVE_MS
        value: "75000"

      - key: HTTP_HEADERS_TIMEOUT_MS
        value: "80000"


      # ── Notification dispatcher ──────────────────────────────────────────

      - key: SCHEDULED_NOTIF_POLL_MS
        value: "30000"

      - key: SCHEDULED_NOTIF_MAX_ATTEMPTS
        value: "5"


      # ── CORS ───────────────────────────────────────────────────────────────
      #
      # CORS_ORIGINS comes from temple-tv-domains.
      #
      # Do not use "*" in production.
      #
      # Supported application formats:
      #
      #   exact:
      #     https://templetv.org.ng
      #
      #   wildcard:
      #     https://*.templetv.org.ng
      #
      #   regex:
      #     /^https:\/\/templetv\./

      - key: CORS_ORIGINS_EXTRA
        value: ""


      # ── API origin ─────────────────────────────────────────────────────────
      #
      # Required by resolveSource() to convert relative localVideoUrl values
      # into absolute URLs.

      - key: API_ORIGIN
        value: https://api.templetv.org.ng


      # ── Admin API token ───────────────────────────────────────────────────

      - key: ADMIN_API_TOKEN
        generateValue: true


      # ── Admin seed ────────────────────────────────────────────────────────
      #
      # These values are supplied in the Render dashboard.
      #
      # If no elevated account exists, startup creates the seed account.
      #
      # To force-reset:
      #
      #   SEED_ADMIN_FORCE=true
      #
      # then deploy once and remove the flag.

      - key: SEED_ADMIN_EMAIL
        sync: false

      - key: SEED_ADMIN_PASSWORD
        sync: false


      # ── YouTube ───────────────────────────────────────────────────────────

      - key: YOUTUBE_API_KEY
        sync: false

      - key: YOUTUBE_WEBHOOK_SECRET
        sync: false

      - key: YOUTUBE_SYNC_INTERVAL_MINS
        value: "30"


      # ── Client error reporting ────────────────────────────────────────────

      - key: CLIENT_ERROR_SINK_URL
        sync: false

      - key: CLIENT_ERROR_SINK_TOKEN
        sync: false


      # ── SMTP ──────────────────────────────────────────────────────────────

      - key: SMTP_HOST
        sync: false

      - key: SMTP_PORT
        value: "587"

      - key: SMTP_SECURE
        value: "false"

      - key: SMTP_USER
        sync: false

      - key: SMTP_PASS
        sync: false

      - key: SMTP_FROM_NAME
        value: "Temple TV | JCTM"


      # ── Web Push / VAPID ──────────────────────────────────────────────────

      - key: VAPID_PUBLIC_KEY
        sync: false

      - key: VAPID_PRIVATE_KEY
        sync: false


      # ── Expo push ─────────────────────────────────────────────────────────

      - key: EXPO_ACCESS_TOKEN
        sync: false


      # ── HLS token authentication ─────────────────────────────────────────

      # REQUIRE_HLS_TOKEN is operator-controlled.
      #
      # Keep it sync:false rather than committing a literal token-like value.

      - key: REQUIRE_HLS_TOKEN
        sync: false

      - key: HLS_TOKEN_SECRET
        sync: false


      # ── CDN ───────────────────────────────────────────────────────────────

      # Optional CloudFront / Cloudflare distribution.

      - key: CDN_BASE_URL
        sync: false


      # ── Broadcast daemon private-network connection ───────────────────────
      #
      # Render injects the private hostname and port.
      #
      # The application constructs:
      #
      #   http://${BROADCAST_DAEMON_HOST}:${BROADCAST_DAEMON_PORT}

      - key: BROADCAST_DAEMON_HOST
        fromService:
          name: temple-tv-broadcast-daemon
          type: pserv
          property: host

      - key: BROADCAST_DAEMON_PORT
        fromService:
          name: temple-tv-broadcast-daemon
          type: pserv
          property: port



  # ══════════════════════════════════════════════════════════════════════════
  # temple-tv-broadcast-daemon
  #
  # Long-lived BroadcastOrchestrator / queue engine
  # Port: 9000
  # Plan: starter
  # ══════════════════════════════════════════════════════════════════════════

  - type: pserv
    name: temple-tv-broadcast-daemon
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    rootDir: .
    autoDeploy: true
    pullRequestPreviewsEnabled: false


    # ── Build filter ────────────────────────────────────────────────────────
    #
    # The daemon should only rebuild when its own broadcast-related code or
    # shared dependencies change.
    #
    # IMPORTANT:
    # render.yaml is included because changes to service configuration must
    # trigger a new deployment.

    buildFilter:
      paths:
        - artifacts/api-server/**
        - lib/db/**
        - lib/broadcast-types/**
        - lib/broadcast-sync/**
        - pnpm-lock.yaml
        - package.json
        - scripts/**
        - render.yaml


    # ── Build ────────────────────────────────────────────────────────────────

    buildCommand: |
      bash ./scripts/render-install.sh && \
      pnpm run verify:render && \
      pnpm --filter @workspace/db run push-force && \
      pnpm --filter @workspace/api-server run build


    # Broadcast daemon startup.

    startCommand: pnpm --filter @workspace/api-server run start:render-daemon


    # Minimal daemon health endpoint.

    healthCheckPath: /healthz


    # ── Environment ─────────────────────────────────────────────────────────

    envVars:

      # Shared PostgreSQL / JWT / Redis / Sentry credentials.
      - fromGroup: temple-tv-shared-secrets


      # ── Runtime ───────────────────────────────────────────────────────────

      - key: NODE_ENV
        value: production

      - key: PORT
        value: "9000"

      - key: RUN_MODE
        value: broadcast


      # ── Memory containment ─────────────────────────────────────────────────

      - key: MALLOC_ARENA_MAX
        value: "2"

      - key: NODE_OPTIONS
        value: "--max-old-space-size=300 --max-http-header-size=16384"

      - key: MEMORY_WARN_RSS_MB
        value: "380"

      - key: MEMORY_RESTART_RSS_MB
        value: "430"

      - key: MEMORY_ABSOLUTE_MAX_RSS_MB
        value: "450"


      # ── Graceful shutdown ─────────────────────────────────────────────────

      - key: SHUTDOWN_DRAIN_MS
        value: "5000"

      - key: SHUTDOWN_PRECLOSE_DELAY_MS
        value: "5000"

      - key: SHUTDOWN_FORCE_EXIT_BUDGET_MS
        value: "25000"


      # ── Database ──────────────────────────────────────────────────────────

      - key: DB_POOL_MAX
        value: "8"


      # ── Broadcast engine ──────────────────────────────────────────────────

      - key: API_ORIGIN
        value: https://api.templetv.org.ng

      - key: QUEUE_MIN_ITEMS
        value: "5"


      # ── Dead-air fallback ─────────────────────────────────────────────────

      - key: BROADCAST_DEADAIR_FALLBACK_URL
        sync: false

      - key: BROADCAST_DEADAIR_FALLBACK_AFTER_MS
        sync: false


      # ── YouTube ───────────────────────────────────────────────────────────

      - key: YOUTUBE_API_KEY
        sync: false

      - key: YOUTUBE_WEBHOOK_SECRET
        sync: false

      - key: YOUTUBE_SYNC_INTERVAL_MINS
        value: "30"


      # ── HLS token authentication ─────────────────────────────────────────

      - key: REQUIRE_HLS_TOKEN
        sync: false

      - key: HLS_TOKEN_SECRET
        sync: false

      - key: INTERNAL_HLS_BYPASS_SECRET
        sync: false


      # ── HTTP / SSE tuning ─────────────────────────────────────────────────

      - key: HTTP_KEEPALIVE_MS
        value: "75000"

      - key: HTTP_HEADERS_TIMEOUT_MS
        value: "80000"


      # ── Client error reporting ────────────────────────────────────────────

      - key: CLIENT_ERROR_SINK_URL
        sync: false

      - key: CLIENT_ERROR_SINK_TOKEN
        sync: false



  # ══════════════════════════════════════════════════════════════════════════
  # temple-tv-admin
  #
  # Vite admin dashboard
  # Static site / global CDN
  # ══════════════════════════════════════════════════════════════════════════

  - type: web
    name: temple-tv-admin
    env: static
    branch: main
    rootDir: .
    autoDeploy: true
    pullRequestPreviewsEnabled: false


    # ── Build filter ────────────────────────────────────────────────────────

    buildFilter:
      paths:
        - artifacts/admin/**
        - lib/player-core/**
        - lib/api-client-react/**
        - lib/api-zod/**
        - lib/api-spec/**
        - lib/broadcast-types/**
        - lib/broadcast-sync/**
        - pnpm-lock.yaml
        - package.json


    # ── Build ────────────────────────────────────────────────────────────────

    buildCommand: |
      bash ./scripts/render-install.sh && \
      pnpm run verify:render && \
      pnpm --filter @workspace/admin run build


    staticPublishPath: ./artifacts/admin/dist/public


    # ── Build-time environment ──────────────────────────────────────────────

    envVars:

      - key: VITE_API_URL
        value: https://api.templetv.org.ng

      - key: BASE_PATH
        value: /


    # ── Security headers ─────────────────────────────────────────────────────

    headers:

      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains; preload"

      - path: /*
        name: X-Frame-Options
        value: DENY

      - path: /*
        name: X-Content-Type-Options
        value: nosniff

      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), interest-cohort=()"

      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin


      # Never cache the SPA shell.

      - path: /index.html
        name: Cache-Control
        value: "no-store, no-cache, must-revalidate"


      # Hashed assets can be cached indefinitely.

      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"


    # ── SPA routing ──────────────────────────────────────────────────────────

    routes:

      - type: rewrite
        source: /*
        destination: /index.html



  # ══════════════════════════════════════════════════════════════════════════
  # temple-tv-web
  #
  # Expo Web / Mobile PWA
  # Static site / global CDN
  # ══════════════════════════════════════════════════════════════════════════

  - type: web
    name: temple-tv-web
    env: static
    branch: main
    rootDir: .
    autoDeploy: true
    pullRequestPreviewsEnabled: false


    # ── Build filter ────────────────────────────────────────────────────────

    buildFilter:
      paths:
        - artifacts/mobile/**
        - lib/player-core/**
        - lib/api-client-react/**
        - lib/api-zod/**
        - lib/api-spec/**
        - lib/broadcast-types/**
        - lib/broadcast-sync/**
        - pnpm-lock.yaml
        - package.json


    # ── Build ────────────────────────────────────────────────────────────────

    buildCommand: |
      bash ./scripts/render-install.sh && \
      pnpm run verify:render && \
      pnpm --filter @workspace/mobile run build:web


    staticPublishPath: ./artifacts/mobile/web-dist


    # ── Build-time environment ──────────────────────────────────────────────

    envVars:

      - key: EXPO_PUBLIC_API_URL
        value: https://api.templetv.org.ng

      - key: EXPO_PUBLIC_DOMAIN
        value: api.templetv.org.ng

      - key: BASE_PATH
        value: /


    # ── Security / caching headers ───────────────────────────────────────────

    headers:

      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains; preload"

      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN

      - path: /*
        name: X-Content-Type-Options
        value: nosniff

      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), interest-cohort=()"


      - path: /index.html
        name: Cache-Control
        value: "no-store, no-cache, must-revalidate"


      - path: /_expo/static/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"


      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"


    # ── SPA routing ──────────────────────────────────────────────────────────

    routes:

      - type: rewrite
        source: /*
        destination: /index.html



  # ══════════════════════════════════════════════════════════════════════════
  # temple-tv-tv
  #
  # Vite TV / Tizen SPA
  # Static site / global CDN
  # ══════════════════════════════════════════════════════════════════════════

  - type: web
