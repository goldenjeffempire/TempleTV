services:
  # ── API server ───────────────────────────────────────────────────────────────
  - type: web
    name: temple-tv-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    rootDir: .
    autoDeploy: true
    pullRequestPreviewsEnabled: false

    buildFilter:
      paths:
        - artifacts/api-server/**
        - lib/db/**
        - lib/api-spec/**
        - lib/broadcast-types/**
        - lib/broadcast-sync/**
        - pnpm-lock.yaml
        - package.json
        - scripts/**
        - render.yaml

    buildCommand: >
      bash ./scripts/render-install.sh &&
      pnpm run verify:render &&
      pnpm --filter @workspace/db run push-force &&
      pnpm --filter @workspace/api-server run build

    startCommand: pnpm --filter @workspace/api-server run start:render-free

    healthCheckPath: /api/healthz

    envVars:
      - fromGroup: temple-tv-shared-secrets
      - fromGroup: temple-tv-domains

      - key: NODE_ENV
        value: production

      - key: PORT
        value: "8080"

      - key: RUN_MODE
        value: all

      - key: TRANSCODER_DISABLE
        value: "true"

      - key: HLS_MAX_CONCURRENT
        value: "3"

      - key: DB_POOL_MAX
        value: "5"

      - key: HLS_SEGMENT_CACHE_MB
        value: "8"

      - key: MALLOC_ARENA_MAX
        value: "2"

      - key: NODE_OPTIONS
        value: "--max-old-space-size=256 --max-http-header-size=16384"

      - key: MEMORY_WARN_RSS_MB
        value: "380"

      - key: MEMORY_RESTART_RSS_MB
        value: "430"

      - key: MEMORY_ABSOLUTE_MAX_RSS_MB
        value: "460"

      - key: SHUTDOWN_DRAIN_MS
        value: "10000"

      - key: SHUTDOWN_PRECLOSE_DELAY_MS
        value: "10000"

      - key: SHUTDOWN_FORCE_EXIT_BUDGET_MS
        value: "28000"

      - key: QUEUE_MIN_ITEMS
        value: "5"

      - key: BROADCAST_DEADAIR_FALLBACK_URL
        sync: false

      - key: BROADCAST_DEADAIR_FALLBACK_AFTER_MS
        sync: false

      - key: STORAGE_HEALTH_INTERVAL_MS
        value: "120000"

      - key: HTTP_KEEPALIVE_MS
        value: "75000"

      - key: HTTP_HEADERS_TIMEOUT_MS
        value: "80000"

      - key: SCHEDULED_NOTIF_POLL_MS
        value: "30000"

      - key: SCHEDULED_NOTIF_MAX_ATTEMPTS
        value: "5"

      - key: CORS_ORIGINS_EXTRA
        value: ""

      - key: API_ORIGIN
        value: https://api.templetv.org.ng

      - key: ADMIN_API_TOKEN
        generateValue: true

      - key: SEED_ADMIN_EMAIL
        sync: false

      - key: SEED_ADMIN_PASSWORD
        sync: false

      - key: YOUTUBE_API_KEY
        sync: false

      - key: YOUTUBE_WEBHOOK_SECRET
        sync: false

      - key: YOUTUBE_SYNC_INTERVAL_MINS
        value: "30"

      - key: CLIENT_ERROR_SINK_URL
        sync: false

      - key: CLIENT_ERROR_SINK_TOKEN
        sync: false

      - key: SMTP_HOST
        sync: false

      - key: SMTP_PORT
        value: "587"

      - key: SMTP_SECURE
        value: "false"

      - key: SMTP_USER
        sync: false

      - key: SMTP_PASS
        sync: false

      - key: SMTP_FROM_NAME
        value: "Temple TV | JCTM"

      - key: VAPID_PUBLIC_KEY
        sync: false

      - key: VAPID_PRIVATE_KEY
        sync: false

      - key: EXPO_ACCESS_TOKEN
        sync: false

      - key: REQUIRE_HLS_TOKEN
        sync: false

      - key: HLS_TOKEN_SECRET
        sync: false

      - key: CDN_BASE_URL
        sync: false

      - key: BROADCAST_DAEMON_HOST
        fromService:
          name: temple-tv-broadcast-daemon
          type: pserv
          property: host

      - key: BROADCAST_DAEMON_PORT
        fromService:
          name: temple-tv-broadcast-daemon
          type: pserv
          property: port

  # ── Broadcast daemon (private service) ──────────────────────────────────────
  - type: pserv
    name: temple-tv-broadcast-daemon
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    rootDir: .
    autoDeploy: true

    buildFilter:
      paths:
        - artifacts/api-server/**
        - lib/db/**
        - lib/api-spec/**
        - lib/broadcast-types/**
        - lib/broadcast-sync/**
        - pnpm-lock.yaml
        - package.json
        - scripts/**
        - render.yaml

    buildCommand: >
      bash ./scripts/render-install.sh &&
      pnpm --filter @workspace/api-server run build

    startCommand: pnpm --filter @workspace/api-server run start:render-daemon

    envVars:
      - fromGroup: temple-tv-shared-secrets
      - fromGroup: temple-tv-domains

      - key: NODE_ENV
        value: production

      - key: RUN_MODE
        value: broadcast

      - key: TRANSCODER_DISABLE
        value: "true"

      - key: TRANSCODING_AUTO_RETRY_DISABLE
        value: "true"

      - key: MALLOC_ARENA_MAX
        value: "2"

      - key: NODE_OPTIONS
        value: "--max-old-space-size=300 --max-http-header-size=16384"

      - key: MEMORY_WARN_RSS_MB
        value: "340"

      - key: MEMORY_RESTART_RSS_MB
        value: "400"

      - key: SHUTDOWN_DRAIN_MS
        value: "10000"

      - key: YOUTUBE_API_KEY
        sync: false

      - key: YOUTUBE_WEBHOOK_SECRET
        sync: false

      - key: YOUTUBE_SYNC_INTERVAL_MINS
        value: "30"

      - key: HLS_TOKEN_SECRET
        sync: false

      - key: CDN_BASE_URL
        sync: false

      - key: API_ORIGIN
        value: https://api.templetv.org.ng

  # ── Admin web panel (static site) ───────────────────────────────────────────
  - type: static
    name: temple-tv-admin
    branch: main
    rootDir: .
    autoDeploy: true
    pullRequestPreviewsEnabled: false

    buildFilter:
      paths:
        - artifacts/admin/**
        - lib/api-spec/**
        - lib/broadcast-types/**
        - pnpm-lock.yaml
        - package.json
        - scripts/**
        - render.yaml

    buildCommand: >
      bash ./scripts/render-install.sh &&
      pnpm --filter @workspace/admin run build

    staticPublishPath: artifacts/admin/dist/public

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: NODE_ENV
        value: production

      - key: VITE_API_URL
        value: https://api.templetv.org.ng

      - key: VITE_API_BASE_URL
        value: https://api.templetv.org.ng

      - key: VITE_SENTRY_DSN
        sync: false

  # ── TV smart-TV web app (static site) ───────────────────────────────────────
  - type: static
    name: temple-tv-tv
    branch: main
    rootDir: .
    autoDeploy: true
    pullRequestPreviewsEnabled: false

    buildFilter:
      paths:
        - artifacts/tv/**
        - lib/api-spec/**
        - lib/broadcast-types/**
        - pnpm-lock.yaml
        - package.json
        - scripts/**
        - render.yaml

    buildCommand: >
      bash ./scripts/render-install.sh &&
      pnpm --filter @workspace/tv run build

    staticPublishPath: artifacts/tv/dist/public

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: NODE_ENV
        value: production

      - key: VITE_API_URL
        value: https://api.templetv.org.ng

      - key: VITE_IMA_AD_TAG_URL
        sync: false
